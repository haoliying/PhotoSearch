name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v3.5.0'
        required: true
        default: 'v3.5.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve version tag
        id: ver
        run: echo "tag=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Ensure Android SDK 34
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # services.gradle.org / downloads.gradle.org 都会重定向到 GitHub Releases，
      # 该下载源偶发 504/超时且 Gradle 缓存未命中时构建必然失败。
      # 这里从多个镜像预下载并解压发行版，直接用解压后的 gradle 二进制构建，
      # 完全绕开 wrapper 下载；仓库中的官方 distributionUrl 保持不变，
      # 用户本地开发不受影响。
      - name: Prepare Gradle distribution (mirror fallback)
        run: |
          set -e
          ZIP="$RUNNER_TEMP/gradle-8.2-bin.zip"
          DIST="$RUNNER_TEMP/gradle-dist"
          OK=0
          for M in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.2-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.2-bin.zip" \
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.2-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.2-bin.zip"; do
            echo "trying $M"
            rm -f "$ZIP"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 300 -o "$ZIP" "$M" \
               && [ -s "$ZIP" ] \
               && unzip -t "$ZIP" > /dev/null 2>&1 \
               && unzip -l "$ZIP" | grep -q "gradle-8.2/bin/gradle"; then
              echo "Gradle distribution OK: $M"
              OK=1
              break
            fi
          done
          test "$OK" = "1" || { echo "all Gradle distribution mirrors failed"; exit 1; }
          ls -lh "$ZIP"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          unzip -q "$ZIP" -d "$DIST"
          GRADLE_BIN="$DIST/gradle-8.2/bin/gradle"
          chmod +x "$GRADLE_BIN"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"
          "$GRADLE_BIN" --version

      - name: Build unsigned release APK
        run: |
          [ -f app/proguard-rules.pro ] || touch app/proguard-rules.pro
          "$GRADLE_BIN" assembleRelease --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          PS_KEYSTORE_BASE64: ${{ secrets.PS_KEYSTORE_BASE64 }}
        run: |
          test -n "$PS_KEYSTORE_BASE64" || { echo "secret PS_KEYSTORE_BASE64 is empty"; exit 1; }
          echo "$PS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/photosearch.jks"
          test -s "$RUNNER_TEMP/photosearch.jks"
          ls -l "$RUNNER_TEMP/photosearch.jks"

      - name: Align and sign APK
        env:
          PS_KEYSTORE_PASSWORD: ${{ secrets.PS_KEYSTORE_PASSWORD }}
          PS_KEY_ALIAS: ${{ secrets.PS_KEY_ALIAS }}
          PS_KEY_PASSWORD: ${{ secrets.PS_KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "using build-tools: $BT"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo 'unsigned APK not found'; find app/build/outputs -type f | head -40; exit 1
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/photosearch.jks" \
            --ks-key-alias "$PS_KEY_ALIAS" \
            --ks-pass "pass:$PS_KEYSTORE_PASSWORD" \
            --key-pass "pass:$PS_KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "PhotoSearch-${{ steps.ver.outputs.tag }}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "PhotoSearch-${{ steps.ver.outputs.tag }}.apk"
          ls -lh "PhotoSearch-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          gh release create "$TAG" "PhotoSearch-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PhotoSearch $TAG" \
            --notes "PhotoSearch $TAG 发布。APK 使用固定自签名证书签名，可直接覆盖安装（请勿更换签名密钥）。本次变更、诊断与验证说明见仓库 docs/ 目录（SEARCH_ACCURACY.md / SEARCH_RECALL.md / EXIF_SEARCH.md）。"
          echo "Released $TAG"
